[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = apps
testpaths = tests apps

# Auto-discovery
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Default options: short tracebacks, strict markers, show slowest 10.
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    -p no:cacheprovider

# Test layer markers. ``tests/conftest.py`` auto-applies these based on
# the directory a test lives in; you only need to mark a test by hand
# when overriding the default (e.g. an integration test inside an app
# tests dir).
markers =
    unit: fast, isolated tests with no I/O — pure Python / mocked boundaries
    integration: hits the database / cache / broker — single process, no HTTP
    e2e: full request/response cycle via APIClient — exercises views + serializers + services + ORM
    slow: marks tests that take >1s; excluded from the default run with `-m "not slow"`
    external: hits a real external service — opt-in only (`-m external`)
