name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pre-commit + audit + sbom + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Used by the opt-in integration tests that exercise real
      # django-valkey backends (see tests/integration/test_valkey_*).
      # The default test suite still runs against LocMemCache; this
      # container only gets traffic when VALKEY_AVAILABLE=1 is set
      # for the pytest step (see env below).
      valkey:
        image: valkey/valkey:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: test_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${{ secrets.TEST_DJANGO_SECRET_KEY }}
      # Opt-in flag for the real-Valkey integration tests. Without this,
      # those tests skip; with it, they swap CACHES via override_settings
      # for their own scope and round-trip against the service container.
      VALKEY_AVAILABLE: "1"
      VALKEY_HOST: 127.0.0.1
      VALKEY_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install pre-commit==3.8.0

      # Runs ruff (lint+format), pydocstyle, darglint, check-dead-utils,
      # check-layering, check-thread-safety, check-openapi-metadata, and
      # check-stale-refs. Skips the two pip-compile hooks because they
      # shell out to PyPI to regenerate lockfiles. Contributors still get
      # drift caught locally via the same pip-compile hooks on their own
      # pre-commit run; a CI-side equivalent (`make deps-check`) is not
      # deterministic enough today — back-to-back docker runs of
      # pip-compile pull different transitive versions when PyPI's index
      # mirror serves stale metadata. Tracked for a later phase when we
      # either pin to a frozen PyPI snapshot or rework the check.
      - name: pre-commit
        env:
          SKIP: pip-compile-base,pip-compile-dev
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Django system check
        run: python manage.py check

      - name: Makemigrations is up to date (no model drift)
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest — unit (fast, no I/O)
        run: make test-unit

      - name: Pytest — integration (DB + cache + broker)
        run: make test-integration

      # `make test-cov` runs the full default suite (unit + integration +
      # e2e) under coverage and enforces .coveragerc `fail_under` (80%
      # after M2.5). The unit + integration steps above stay for fast
      # feedback — a failing unit test should surface in <10s, not after
      # the full coverage run.
      - name: Pytest — full suite + coverage gate
        run: make test-cov

      # Per-package floors. Numbers reflect the honest M2.5 measurement;
      # ratchet plan documented in CHANGELOG. Adjust here when the
      # underlying packages move.
      - name: Coverage — apps/core/ floor (80%)
        run: coverage report --include='apps/core/*' --fail-under=80

      - name: Coverage — apps/accounts/ floor (80%)
        run: coverage report --include='apps/accounts/*' --fail-under=80

      - name: pip-audit (prod deps)
        run: make audit

      - name: SBOM drift check
        run: make sbom-diff
