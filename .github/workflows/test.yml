name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pre-commit + audit + sbom + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: test_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${{ secrets.TEST_DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/test.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install pre-commit==3.8.0

      # Runs ruff (lint+format), pydocstyle, darglint, check-dead-utils,
      # check-layering, check-thread-safety, check-openapi-metadata, and
      # check-stale-refs. Skips the two pip-compile hooks because they
      # shell out to PyPI to regenerate lockfiles — drift is caught
      # locally by `make deps-check` (a future CI step once it's wired up;
      # tracked in v1.0.0 roadmap M2).
      - name: pre-commit
        env:
          SKIP: pip-compile-base,pip-compile-dev
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Django system check
        run: python manage.py check

      - name: Makemigrations is up to date (no model drift)
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest — unit (fast, no I/O)
        run: make test-unit

      - name: Pytest — integration (DB + cache + broker)
        run: make test-integration

      - name: Pytest — e2e + default suite
        run: make test

      - name: pip-audit (prod deps)
        run: make audit

      - name: SBOM drift check
        run: make sbom-diff
