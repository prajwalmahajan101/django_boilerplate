repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstring style)
        files: ^apps/.*\.py$

  - repo: https://github.com/terrencepreilly/darglint
    rev: v1.8.1
    hooks:
      - id: darglint
        name: darglint (docstring completeness)
        args: ["-v", "2"]
        files: ^apps/.*\.py$

  # Keep requirements/*.txt in sync with requirements/*.in. pre-commit
  # provisions pip-tools into its own managed virtualenv via
  # additional_dependencies, so contributors don't need it on PATH.
  - repo: local
    hooks:
      - id: pip-compile-base
        name: pip-compile (base.in -> base.txt)
        entry: pip-compile --quiet --output-file=requirements/base.txt requirements/base.in
        language: python
        additional_dependencies: ["pip-tools==7.5.3"]
        files: ^requirements/base\.in$
        pass_filenames: false

      - id: pip-compile-dev
        name: pip-compile (dev.in -> dev.txt)
        entry: pip-compile --quiet --output-file=requirements/dev.txt requirements/dev.in
        language: python
        additional_dependencies: ["pip-tools==7.5.3"]
        files: ^requirements/(base|dev)\.in$
        pass_filenames: false

      # Catch utility atrophy — a public symbol anywhere in apps/core/
      # with no callers in the tree (see scripts/check_dead_utils.py for
      # the rules and the allowlist escape hatch). Broader than just
      # apps/core/utils/ so orphans in resilience providers, lifecycle
      # helpers, etc. get caught alongside.
      - id: check-dead-utils
        name: check for dead public symbols under apps/core/
        entry: python scripts/check_dead_utils.py
        language: system
        files: ^apps/core/.*\.py$
        pass_filenames: false

      # Catch doc rot after a rename / delete — the same renamed symbol
      # had shown up in docs three review cycles in a row before this
      # hook landed. Patterns + replacement hints live in
      # scripts/stale_refs.yaml; append there as part of every rename
      # commit. Scans docs/ + CLAUDE.md + README.md + app-level
      # CLAUDE.md, skips .code_review/ and CHANGELOG.md.
      # Enforce the one-rule layering invariant: apps.core must never
      # import from a sibling domain app (today: accounts) or from
      # config. See apps/core/CLAUDE.md and scripts/check_layering.py
      # for the rationale. Test files are exempt — fixtures legitimately
      # cross app boundaries.
      - id: check-layering
        name: enforce apps/core layering (no sibling/config imports)
        entry: python scripts/check_layering.py
        language: system
        files: ^apps/core/.*\.py$
        pass_filenames: false

      # Catch the recurring "module-level dict/set without a Lock"
      # registry pattern — the same bug landed and was fixed three
      # times before this hook (resilience registry, auth registry,
      # tasks registry). See scripts/check_thread_safety.py for the
      # AST shape and waiver syntax.
      - id: check-thread-safety
        name: guard against unlocked module-level mutable state
        entry: python scripts/check_thread_safety.py
        language: system
        files: ^apps/core/.*\.py$
        pass_filenames: false

      # Catch silent OpenAPI contract regressions — a new DRF view
      # shipped without an @extend_schema (or *_schema alias) /
      # serializer_class would render in drf-spectacular as a
      # generic `object` for data and drop the standard error
      # envelope responses.
      - id: check-openapi-metadata
        name: enforce DRF view OpenAPI metadata
        entry: python scripts/check_openapi_metadata.py
        language: system
        files: ^apps/.*/views\.py$
        pass_filenames: false

      - id: check-stale-refs
        name: check for stale references in docs
        entry: python scripts/check_stale_refs.py
        language: system
        files: '(^docs/.*\.md$)|(^CLAUDE\.md$)|(^README\.md$)|(^apps/.*/CLAUDE\.md$)|(^scripts/stale_refs\.yaml$)'
        pass_filenames: false
