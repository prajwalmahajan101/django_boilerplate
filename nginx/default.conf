# Dev-only reverse proxy. Production uses ingress / ALB; this config
# exists so `docker compose up` matches the documented dev flow without
# requiring the docker-compose.override.yml workaround that disabled
# nginx during M8 e2e (see docs/known-issues.md).

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # WhiteNoise also serves static, but mounting them at the proxy
    # mirrors prod topology (CDN / ALB serves /static/ directly) so
    # devs catch missing collectstatic before deploy.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Request-ID is generated by core.middleware.RequestIDMiddleware;
        # forward an inbound one if the client supplied it (matches prod
        # ingress behaviour).
        proxy_set_header X-Request-ID      $http_x_request_id;
        proxy_redirect off;

        # Gunicorn's default --timeout is 130 (Dockerfile); keep this
        # higher so nginx isn't the one to time out first.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Match Gunicorn's request-body limit; large multipart uploads
    # (e.g. SES attachments) are the only legitimate >1MB requests.
    client_max_body_size 10m;
}
